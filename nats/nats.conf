jetstream {
  store_dir: "/data"
}

http_port: 8222

authorization {
  users: [
    {
      user: "user-service"
      password: $NATS_USER_SERVICE_PASSWORD
      permissions: {
        publish: {
          allow: ["user.created", "$JS.API.STREAM.INFO.USER_EVENTS", "$JS.API.STREAM.CREATE.USER_EVENTS"]
        }
        subscribe: {
          allow: ["_INBOX.>"]
        }
      }
    }
    {
      user: "notification-service"
      password: $NATS_NOTIFICATION_SERVICE_PASSWORD
      permissions: {
        publish: {
          allow: ["$JS.API.STREAM.INFO.USER_EVENTS", "$JS.API.STREAM.CREATE.USER_EVENTS", "$JS.API.CONSUMER.>", "$JS.ACK.USER_EVENTS.>"]
        }
        subscribe: {
          allow: ["user.created", "_INBOX.>"]
        }
      }
    }
  ]
}
